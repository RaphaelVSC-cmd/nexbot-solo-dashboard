<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Deep obsidian terminal background -->
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e16"/>
      <stop offset="60%" stop-color="#07070b"/>
      <stop offset="100%" stop-color="#030305"/>
    </linearGradient>

    <!-- Metallic diagonal cyber slash -->
    <linearGradient id="metalDiag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ececf6"/>
      <stop offset="100%" stop-color="#88889c"/>
    </linearGradient>

    <!-- Subtle crisp glow -->
    <filter id="crispGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#ffffff" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base container -->
  <rect width="100" height="100" rx="14" fill="url(#techBg)"/>
  <rect x="2" y="2" width="96" height="96" rx="12" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>

  <!-- Concentric Rounded Corner Brackets (abgerundet parallel zum grauen Rand) -->
  <g stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="square">
    <path d="M 18 6 L 14 6 A 8 8 0 0 0 6 14 L 6 18"/>
    <path d="M 82 6 L 86 6 A 8 8 0 0 1 94 14 L 94 18"/>
    <path d="M 94 82 L 94 86 A 8 8 0 0 1 86 94 L 82 94"/>
    <path d="M 6 82 L 6 86 A 8 8 0 0 0 14 94 L 18 94"/>
  </g>

  <!-- Subtle Tech Grid Tick Marks -->
  <line x1="50" y1="6" x2="50" y2="12" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <line x1="50" y1="88" x2="50" y2="94" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>

  <!-- Razor-Sharp Technical "N" (100% kantig, 0% geschwungen, messerscharf) -->
  <g filter="url(#crispGlow)">
    <!-- Left Pillar -->
    <rect x="22" y="22" width="12" height="56" fill="#ffffff"/>
    <!-- Angular Diagonal Cyber Slash -->
    <polygon points="34,22 66,64 66,78 34,36" fill="url(#metalDiag)"/>
    <!-- Right Pillar -->
    <rect x="66" y="22" width="12" height="56" fill="#ffffff"/>
  </g>
</svg>
